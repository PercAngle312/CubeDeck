          git clone --depth 1 https://github.com/devkitPro/libgba.git /tmp/libgba
          make -C /tmp/libgba
          make -C /tmp/libgba install
          mkdir -p ram-v9
          arm-none-eabi-gcc -O2 -Wall -Wextra -Werror -mthumb -mthumb-interwork \
            -I$DEVKITPRO/libgba/include -specs=gba_mb.specs \
            experiments/cartridge-probe/gba-ram-status.c -L$DEVKITPRO/libgba/lib -lgba \
            -o ram-v9/status.elf
          arm-none-eabi-objcopy -O binary ram-v9/status.elf ram-v9/ram-status-v9.gba
          gbafix ram-v9/ram-status-v9.gba -tCDRAM9 -cCDR9 -m01
          size=$(stat -c %s ram-v9/ram-status-v9.gba)
          truncate -s "$(( (size + 15) / 16 * 16 ))" ram-v9/ram-status-v9.gba
          test "$(stat -c %s ram-v9/ram-status-v9.gba)" -le 16384
          # Never publish toolchain-provided logo bytes or the ELF.
          dd if=/dev/zero of=ram-v9/ram-status-v9.gba bs=1 seek=4 count=156 conv=notrunc status=none
      - uses: actions/upload-artifact@v4
