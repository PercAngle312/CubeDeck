name: Build CubeDeck

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-gamecube:
    name: Build GameCube app
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build GameCube DOL
        run: make clean && make
      - name: Upload GameCube artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubedeck-gamecube
          path: |
            cubedeck.dol
            cubedeck.elf
          if-no-files-found: error

  build-gba-diagnostic:
    name: Build GBA diagnostic ROM
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and install libgba from source
        run: |
          git clone --depth 1 https://github.com/devkitPro/libgba.git /tmp/libgba
          make -C /tmp/libgba
          make -C /tmp/libgba install
          test -f "$DEVKITPRO/libgba/include/gba.h"
          test -f "$DEVKITPRO/libgba/lib/libgba.a"
      - name: Build GBA diagnostic ROM
        run: make -C gba-diagnostic clean all
      - name: Upload GBA diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubedeck-gba-diagnostic
          path: |
            gba-diagnostic/cubedeck-gba-diagnostic.gba
            gba-diagnostic/cubedeck-gba-diagnostic.elf
          if-no-files-found: error

  test-transport-protocol:
    name: Test portable transport protocol
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile host protocol tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c tests/test_transport_protocol.c \
            -o /tmp/test-transport-protocol
      - name: Run host protocol tests
        run: /tmp/test-transport-protocol

  test-chunk-session:
    name: Test retry-safe chunk sessions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run chunk tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            tests/test_chunk_session.c -o /tmp/test-chunk-session
          /tmp/test-chunk-session

  test-reliable-link:
    name: Test reliable transfer and recovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run stop-and-wait simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c tests/test_reliable_link.c \
            -o /tmp/test-reliable-link
          /tmp/test-reliable-link

  test-image-integrity:
    name: Test whole-image checksum
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and simulate checked transfer
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            tests/test_image_integrity.c -o /tmp/test-image-integrity
          /tmp/test-image-integrity

  test-verified-session:
    name: Test manifest-verified transfers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run manifest session tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/image_integrity.c protocol/verified_session.c \
            tests/test_verified_session.c -o /tmp/test-verified-session
          /tmp/test-verified-session

  test-session-wire:
    name: Test framed verified sessions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and test wire framing and ACK NACK
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            protocol/verified_session.c protocol/session_wire.c \
            tests/test_session_wire.c -o /tmp/test-session-wire
          /tmp/test-session-wire

  test-protocol-matrix:
    name: Test all payload sizes and bit corruption
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile with sanitizers and run matrix
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c tests/test_protocol_matrix.c \
            -o /tmp/test-protocol-matrix
          /tmp/test-protocol-matrix

  test-packet-stream:
    name: Test incremental word stream parsing
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run stream tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/packet_stream.c \
            tests/test_packet_stream.c -o /tmp/test-packet-stream
          /tmp/test-packet-stream

  test-session-sender:
    name: Simulate complete manifest-to-finish transfers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run complete transfer simulations
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            protocol/verified_session.c protocol/session_wire.c \
            protocol/session_sender.c tests/test_session_sender.c \
            -o /tmp/test-session-sender
          /tmp/test-session-sender

  test-transfer-fault-sweep:
    name: Run 215 transfer fault scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run deterministic fault sweep
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            protocol/verified_session.c protocol/session_wire.c \
            protocol/session_sender.c tests/test_transfer_fault_sweep.c \
            -o /tmp/test-transfer-fault-sweep
          /tmp/test-transfer-fault-sweep

  test-word-level-session:
    name: Test end-to-end word stream transfers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Simulate complete word-level bidirectional exchange
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/packet_stream.c \
            protocol/chunk_session.c protocol/reliable_link.c \
            protocol/image_integrity.c protocol/verified_session.c \
            protocol/session_wire.c protocol/session_sender.c \
            tests/test_word_level_session.c -o /tmp/test-word-level-session
          /tmp/test-word-level-session

  audit-storage-safety:
    name: Audit runtime storage APIs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject direct memory-card and filesystem writes
        run: python3 tests/check_runtime_storage_writes.py

  test-stream-receiver:
    name: Test RAM-light streaming integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and run streaming checks
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/stream_receiver.c protocol/image_integrity.c \
            tests/test_stream_receiver.c -o /tmp/test-stream-receiver
          /tmp/test-stream-receiver

  test-stream-wire:
    name: Test 128 KiB framed stream and retries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and run large stream simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/image_integrity.c \
            protocol/stream_receiver.c protocol/stream_wire.c \
            protocol/reliable_link.c protocol/chunk_session.c \
            tests/test_stream_wire.c -o /tmp/test-stream-wire
          /tmp/test-stream-wire

  test-stream-sender:
    name: Test 128 KiB streaming sender and receiver
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and simulate callback-driven transfer
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/image_integrity.c \
            protocol/stream_receiver.c protocol/stream_wire.c \
            protocol/stream_sender.c protocol/reliable_link.c \
            protocol/chunk_session.c tests/test_stream_sender.c \
            -o /tmp/test-stream-sender
          /tmp/test-stream-sender

  test-stream-edges:
    name: Test empty stream and recovery edge cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and run empty-session checks
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/image_integrity.c \
            protocol/stream_receiver.c protocol/stream_wire.c \
            protocol/stream_sender.c protocol/reliable_link.c \
            protocol/chunk_session.c tests/test_stream_edges.c \
            -o /tmp/test-stream-edges
          /tmp/test-stream-edges

  test-stream-word-link:
    name: Test 64 KiB bidirectional word streaming
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and run full word-level stream
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/packet_stream.c \
            protocol/image_integrity.c protocol/stream_receiver.c \
            protocol/stream_wire.c protocol/stream_sender.c \
            protocol/reliable_link.c protocol/chunk_session.c \
            tests/test_stream_word_link.c -o /tmp/test-stream-word-link
          /tmp/test-stream-word-link

  test-stream-hash:
    name: Test constant-memory source CRC preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compute streaming CRC across source boundaries
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/stream_hash.c protocol/image_integrity.c \
            tests/test_stream_hash.c -o /tmp/test-stream-hash
          /tmp/test-stream-hash

  test-transfer-segments:
    name: Test 32 MiB sequence-safe segment plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate bounded multi-session image layout
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transfer_segments.c tests/test_transfer_segments.c \
            -o /tmp/test-transfer-segments
          /tmp/test-transfer-segments

  test-max-stream-window:
    name: Test maximum 65535-packet stream window
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run 16 MiB bounded zero-allocation transfer
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -Iinclude \
            protocol/stream_hash.c protocol/stream_sender.c \
            protocol/stream_receiver.c protocol/stream_wire.c \
            protocol/reliable_link.c protocol/chunk_session.c \
            protocol/transport_protocol.c \
            tests/test_stream_max_window.c -o /tmp/test-max-window
          /tmp/test-max-window

  test-session-guard:
    name: Test session-bound ACK and replay isolation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and validate v2 packet envelope
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/session_guard.c \
            tests/test_session_guard.c -o /tmp/test-session-guard
          /tmp/test-session-guard

  test-bound-stream:
    name: Test session-bound streaming and stale replay
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile and test transfer-ID framed sender and receiver
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            protocol/stream_receiver.c protocol/stream_sender.c \
            protocol/stream_wire.c protocol/session_guard.c \
            protocol/bound_stream.c tests/test_bound_stream.c \
            -o /tmp/test-bound-stream
          /tmp/test-bound-stream

  test-bound-word-stream:
    name: Test session-bound 64 KiB word streaming
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and run session-bound word-level fault simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/packet_stream.c \
            protocol/chunk_session.c protocol/reliable_link.c \
            protocol/image_integrity.c protocol/stream_receiver.c \
            protocol/stream_sender.c protocol/stream_wire.c \
            protocol/session_guard.c protocol/bound_stream.c \
            tests/test_bound_word_stream.c -o /tmp/test-bound-word-stream
          /tmp/test-bound-word-stream

  compile-protocol-for-gamecube:
    name: Cross-compile portable v2 transport for GameCube
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile transfer engine for PowerPC
        run: |
          set -eu
          mkdir -p /tmp/cd-ppc-objects
          for file in protocol/transport_protocol.c protocol/chunk_session.c \
                      protocol/reliable_link.c protocol/image_integrity.c \
                      protocol/verified_session.c protocol/packet_stream.c \
                      protocol/stream_receiver.c protocol/stream_sender.c \
                      protocol/stream_wire.c protocol/session_guard.c \
                      protocol/bound_stream.c protocol/stream_hash.c \
                      protocol/transfer_segments.c protocol/word_exchange.c \
                      protocol/joybus_recovery.c; do
            "$DEVKITPRO/devkitPPC/bin/powerpc-eabi-gcc" -std=c11 -Wall -Wextra -Werror -Iinclude \
              -O1 -c "$file" -o "/tmp/cd-ppc-objects/$(basename "$file" .c).o"
          done

  compile-protocol-for-gba:
    name: Cross-compile portable v2 transport for GBA
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile transfer engine for ARM7TDMI
        run: |
          set -eu
          mkdir -p /tmp/cd-arm-objects
          for file in protocol/transport_protocol.c protocol/chunk_session.c \
                      protocol/reliable_link.c protocol/image_integrity.c \
                      protocol/verified_session.c protocol/packet_stream.c \
                      protocol/stream_receiver.c protocol/stream_sender.c \
                      protocol/stream_wire.c protocol/session_guard.c \
                      protocol/bound_stream.c protocol/stream_hash.c \
                      protocol/transfer_segments.c protocol/word_exchange.c \
                      protocol/joybus_recovery.c; do
            "$DEVKITPRO/devkitARM/bin/arm-none-eabi-gcc" -std=c11 -Wall -Wextra -Werror -Iinclude \
              -O1 -mcpu=arm7tdmi -mthumb -c "$file" \
              -o "/tmp/cd-arm-objects/$(basename "$file" .c).o"
          done

  test-word-exchange:
    name: Test nonblocking word exchange with retries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run CRC-bound nonblocking reply simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            protocol/packet_stream.c protocol/stream_receiver.c \
            protocol/stream_sender.c protocol/stream_wire.c \
            protocol/session_guard.c protocol/bound_stream.c \
            protocol/word_exchange.c tests/test_word_exchange.c \
            -o /tmp/test-word-exchange
          /tmp/test-word-exchange

  test-word-exchange-fault-matrix:
    name: Test word exchange recovery fault matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Simulate damaged, missing and truncated replies
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/chunk_session.c \
            protocol/reliable_link.c protocol/image_integrity.c \
            protocol/packet_stream.c protocol/stream_receiver.c \
            protocol/stream_sender.c protocol/stream_wire.c \
            protocol/session_guard.c protocol/bound_stream.c \
            protocol/word_exchange.c tests/test_word_exchange_fault_matrix.c \
            -o /tmp/test-word-exchange-fault-matrix
          /tmp/test-word-exchange-fault-matrix

  build-v2-probe-gamecube:
    name: Build opt-in v2 Joybus GameCube probe
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile isolated v2 GameCube DOL
        run: |
          make -f experiments/v2-probe/Makefile gamecube
      - name: Upload experimental DOL
        uses: actions/upload-artifact@v4
        with:
          name: cubedeck-v2-probe-gamecube
          path: experiments/v2-probe/out/cubedeck-v2-probe.dol

  build-v2-probe-gba:
    name: Build opt-in v2 Joybus GBA probe
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check libgba availability and compile isolated v2 GBA ROM
        run: |
          set -eu
          if [ ! -f "$DEVKITPRO/libgba/include/gba.h" ]; then
            pacman -Sy --noconfirm gba-dev
          fi
          make -f experiments/v2-probe/Makefile gba
      - name: Upload experimental GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: cubedeck-v2-probe-gba
          path: experiments/v2-probe/out/cubedeck-v2-probe.gba

  test-v2-probe-contract:
    name: Test exact seven-word console probe contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify probe length, opcode, transfer ID, and CRC
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/session_guard.c \
            tests/test_v2_probe_contract.c -o /tmp/test-v2-probe-contract
          /tmp/test-v2-probe-contract

  build-v2-multiframe-gamecube:
    name: Build opt-in three-frame GameCube probe
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile isolated GameCube three-frame DOL
        run: make -f experiments/v2-probe/Makefile multiframe-gamecube
      - name: Upload isolated three-frame DOL
        uses: actions/upload-artifact@v4
        with:
          name: cubedeck-v2-multiframe-gamecube
          path: experiments/v2-probe/out/cubedeck-v2-multiframe.dol

  build-v2-multiframe-gba:
    name: Build opt-in three-frame GBA probe
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile isolated GBA three-frame ROM
        run: |
          set -eu
          if [ ! -f "$DEVKITPRO/libgba/include/gba.h" ]; then
            pacman -Sy --noconfirm gba-dev
          fi
          make -f experiments/v2-probe/Makefile multiframe-gba
      - name: Upload isolated three-frame GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: cubedeck-v2-multiframe-gba
          path: experiments/v2-probe/out/cubedeck-v2-multiframe.gba

  test-v2-multiframe-contract:
    name: Test ordered three-frame v2 Joybus sample contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check sequence, duplicates, CRC and payload corruption
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=undefined -fno-omit-frame-pointer -Iinclude \
            protocol/transport_protocol.c protocol/session_guard.c \
            tests/test_v2_multiframe_contract.c -o /tmp/test-v2-multiframe
          /tmp/test-v2-multiframe

  build-v2-ack-gamecube:
    name: Build opt-in packet-level ACK GameCube experiment
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated ACK/NACK DOL
        run: make -f experiments/v2-probe/Makefile ack-gamecube
      - uses: actions/upload-artifact@v4
        with:
          name: cubedeck-v2-ack-gamecube
          path: experiments/v2-probe/out/cubedeck-v2-ack.dol

  build-v2-ack-gba:
    name: Build opt-in packet-level ACK GBA experiment
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated ACK/NACK GBA ROM
        run: |
          set -eu
          if [ ! -f "$DEVKITPRO/libgba/include/gba.h" ]; then
            pacman -Sy --noconfirm gba-dev
          fi
          make -f experiments/v2-probe/Makefile ack-gba
      - uses: actions/upload-artifact@v4
        with:
          name: cubedeck-v2-ack-gba
          path: experiments/v2-probe/out/cubedeck-v2-ack.gba

  test-ack-probe-startup:
    name: Guard ACK probe RESET to STATUS transition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check RESET callback continues to STATUS
        run: python3 tests/test_ack_probe_startup.py

  test-ack-probe-diagnostics:
    name: Guard packet ACK probe failure diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
