  package-joyboot-pair:
    name: Package verified experimental Joyboot pair
    needs: [build-joyboot-uploader, build-joyboot-gba-probe, test-sd2sp2-mount, test-sd2sp2-gpt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cubedeck-joyboot-experimental
          path: pair/gamecube
      - uses: actions/download-artifact@v4
        with:
          name: cubedeck-joyboot-gba-probe
          path: pair/gba
      - name: Check paired artifacts and write checksums
        run: |
          set -eu
          test -s pair/gamecube/cubedeck-joyboot-experimental.dol
          test -s pair/gba/joyboot-probe.gba
          python3 - <<'PY'
          from pathlib import Path
          gba = Path("pair/gba/joyboot-probe.gba").read_bytes()
          assert 512 <= len(gba) <= 0x3ff40
          assert len(gba) % 16 == 0
          checksum = (-(sum(gba[0xa0:0xbd]) + 0x19)) & 0xff
          assert gba[0xb2] == 0x96
          assert gba[0xbd] == checksum
          PY
          mkdir -p sd-ready/cubedeck
          cp pair/gamecube/cubedeck-joyboot-experimental.dol sd-ready/cubedeck-sd2sp2-v7.dol
          cp pair/gba/joyboot-probe.gba sd-ready/cubedeck/joyboot-probe.gba
          # Storage-only fixture: strip Nintendo logo, no BIOS/ROM assets.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sd-ready/cubedeck/joyboot-probe.gba")
          data = bytearray(p.read_bytes())
          data[4:0xa0] = bytes(0x9c)
          p.write_bytes(data)
          PY
          printf '%s\n' 'CubeDeck SD2SP2 Diagnostic v7 — STORAGE ONLY' \
            "Commit: $GITHUB_SHA" "CI run: $GITHUB_RUN_ID" \
            'Copy these contents to SD root; launch cubedeck-sd2sp2-v7.dol in Swiss.' \
            'Expected path sd:/cubedeck/joyboot-probe.gba. No upload is enabled.' \
            'PASS means file read and image checks passed, not GBA execution.' \
            'Probe logo removed: this storage fixture is not BIOS-bootable.' \
            'No BIOS, commercial ROM or Nintendo logo is included.' \
            'Report GPT error/candidates/G rows, mount, image bytes and PASS.' \
            'Hardware mount fix remains unverified. No formatting or writes.' > sd-ready/README.txt
          (cd sd-ready && sha256sum cubedeck-sd2sp2-v7.dol cubedeck/joyboot-probe.gba > SHA256SUMS)
          (cd sd-ready && zip -r ../cubedeck-sd2sp2-v7-${GITHUB_SHA:0:12}.zip .)
          cd pair
          sha256sum gamecube/cubedeck-joyboot-experimental.dol gba/joyboot-probe.gba > SHA256SUMS
          printf '%s\n' 'EXPERIMENTAL / UNVERIFIED ON HARDWARE' \
            'GBA requires empty-slot multiboot sequence and the supported cartridge-insertion workflow.' \
            'Do not treat a successful build as a successful cartridge read.' > README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cubedeck-joyboot-paired-experimental
          path: pair/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cubedeck-sd2sp2-v7-sd-ready
          path: cubedeck-sd2sp2-v7-*.zip
          if-no-files-found: error

