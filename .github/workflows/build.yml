    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install libgba (required by GBA probe)
        run: |
          git clone --depth 1 https://github.com/devkitPro/libgba.git /tmp/libgba
          make -C /tmp/libgba
          make -C /tmp/libgba install
          test -f "$DEVKITPRO/libgba/include/gba.h"
      - name: Build GBA companion without proprietary assets
        run: |
          set -eu
          mkdir -p experiments/cartridge-probe/out
          arm-none-eabi-gcc -O2 -Wall -Wextra -Werror -mthumb -mthumb-interwork \
            -I$DEVKITPRO/libgba/include -Iinclude \
            -Iexperiments/cartridge-probe -specs=gba.specs \
            experiments/cartridge-probe/gba-joyboot-probe.c \
            experiments/cartridge-probe/gba_rom_reader.c \
            protocol/gba_cart_header.c protocol/gba_cart_probe.c \
            protocol/cart_probe_reply.c \
            -L$DEVKITPRO/libgba/lib -lgba \
            -o experiments/cartridge-probe/out/joyboot-probe.elf
          arm-none-eabi-objcopy -O binary \
            experiments/cartridge-probe/out/joyboot-probe.elf \
            experiments/cartridge-probe/out/joyboot-probe.gba
          gbafix experiments/cartridge-probe/out/joyboot-probe.gba \
            -tCDJOYPROBE -cCDJB -m01
          # GameCube uploader requires 16-byte alignment, and the final
          # file must match the size used to derive the Joyboot client key.
          gba_file=experiments/cartridge-probe/out/joyboot-probe.gba
          gba_size=$(stat -c %s "$gba_file")
          aligned_size=$(( (gba_size + 15) / 16 * 16 ))
          truncate -s "$aligned_size" "$gba_file"
          test "$(( $(stat -c %s experiments/cartridge-probe/out/joyboot-probe.gba) % 16 ))" -eq 0
          test "$(stat -c %s experiments/cartridge-probe/out/joyboot-probe.gba)" -ge 512
          test "$(stat -c %s experiments/cartridge-probe/out/joyboot-probe.gba)" -le 261952
      - uses: actions/upload-artifact@v4
        with:
          name: cubedeck-joyboot-gba-probe
          path: experiments/cartridge-probe/out/joyboot-probe.gba
          if-no-files-found: error

